<!DOCTYPE html>

<!-- Fig. 2.12: tabla.html -->
<!-- Creacion de una tabla basica -->
<html>
    <head>
        <meta charset="uft-8">
        <title>Una tabla de HTML5 simple</title>
    </head>

    <body>
        <a href="../Indices/IndiceC2.html">Ir a la página principal</a>
        <hr>
        
        <!-- la etiqueta <table> abre una tabla -->
        <table border = "1">

            <!-- la seccion <tgead> aparece primero en la tabla -->
            <!-- da formato al area del encabezado de la tabla -->
            <thead>
                <tr> <!-- <tr> inserta una fila en la tabla -->
                    <th>Fruta</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <!-- la seccion <tfoot> aparece al ultimo en la tabla -->
            <!-- da formato al pie de la tabla -->
            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>$3.75</th>
                </tr>
            </tfoot>

            <!-- todo el contenido de la tabla esta encerrado -->
            <!-- dentro del elemento <tbody> -->
            <tbody>
                <tr>
                    <td>Manzana</td> <!-- inserta una celda de datos -->
                    <td>$0.25</td>
                </tr>
                <tr>
                    <td>Naranja</td>
                    <td>$0.50</td>
                </tr>
                <tr>
                    <td>Pl&aacute;tano</td>
                    <td>$1.00</td>
                </tr>
                <tr>
                    <td>Pi&nabla;a</td>
                    <td>$2.00</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
